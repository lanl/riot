# This file was made with the assistance of generative AI.
name: Unit tests (CPU)

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libhdf5-mpich-dev \
            git \
            cmake

      - name: Build, install, and test
        run: |
          python -m venv riot_venv
          . riot_venv/bin/activate
          python -m pip install numpy scipy h5py "pybind11[global]"

          cmake -S . -B build \
            -DRIOT_ENABLE_UNIT_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython_ROOT_DIR="$VIRTUAL_ENV" \
            -DCMAKE_INSTALL_PREFIX="$VIRTUAL_ENV"

          cmake --build build --parallel
          cmake --install build
          ctest --test-dir build --output-on-failure
