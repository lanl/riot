unit_darwin-skylake:
  stage: regression
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://asc-git.lanl.gov
  tags:
    - darwin-slurm-shared
  variables:
    SCHEDULER_PARAMETERS: "--nodes=1 --partition=skylake-gold"
    CCACHE_TAG: darwin-skylake
  only:
    - main
    - merge_requests
  script:
    - module load openmpi/3.1.6-gcc_12.2.0 hdf5/1.12.2
    - cd ${CI_PROJECT_DIR}
    - python3.11 -m venv cpu_venv
    - source cpu_venv/bin/activate
    - pip install h5py numpy scipy
    - mkdir -p build && cd build
    - cmake -DRIOT_ENABLE_UNIT_TESTS=ON -DPLUGINS_DIR=${PLUGINS_REPO_DIR} -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_BIN -DCMAKE_C_COMPILER_LAUNCHER=$CCACHE_BIN ..
    - make -j32
    - ctest
    - $CCACHE_BIN -s

regression_darwin-skylake:
  stage: regression
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://asc-git.lanl.gov
  tags:
    - darwin-slurm-shared
  variables:
    SCHEDULER_PARAMETERS: "--nodes=1 --partition=skylake-gold"
    CCACHE_TAG: darwin-skylake
  only:
    - main
    - merge_requests
  script:
    - module load openmpi/3.1.6-gcc_12.2.0 hdf5/1.12.2
    - cd ${CI_PROJECT_DIR}
    - python3.11 -m venv cpu_venv
    - source cpu_venv/bin/activate
    - pip install h5py numpy scipy
    - export INSTALL_PREFIX=$(python -c 'import sys; print(sys.prefix)')
    - cd $CI_PROJECT_DIR/tst
    - python3.11 run_tests.py
      --log_file=log_file_cpu.txt
      --cmake=-DPLUGINS_DIR=${PLUGINS_REPO_DIR}
      --cmake=-DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_BIN
      --cmake=-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE_BIN
      --cmake=-DRIOT_REGRESSION_GOLD_VER=$GOLD_VER
      --cmake=-DRIOT_REGRESSION_GOLD_HASH=$GOLD_HASH
      --cmake=-DRIOT_REGRESSION_GOLD_LOCAL=$GOLD_LOCAL
      --cmake=-DRIOT_ENABLE_REGRESSION_TESTS=ON
      --cmake=-DCMAKE_INSTALL_PREFIX=${INSTALL_PREFIX}
      --save_build
      --make_nproc=32
    - $CCACHE_BIN -s
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - tst/log_file_cpu.txt

regression_darwin-v100:
  stage: regression
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://asc-git.lanl.gov
  tags:
    - darwin-slurm-shared
  variables:
    SCHEDULER_PARAMETERS: "--nodes=1 --partition=volta-x86"
    CCACHE_TAG: darwin-v100
  only:
    - main
    - merge_requests
  script:
    - module load nvhpc/25.1 cuda/12.9.1 gcc/11.2.0 hdf5/1.12.2
    - cd ${CI_PROJECT_DIR}
    - python3.11 -m venv gpu_venv
    - source gpu_venv/bin/activate
    - pip install h5py numpy
    - export INSTALL_PREFIX=$(python -c 'import sys; print(sys.prefix)')
    - cd $CI_PROJECT_DIR/tst
    - python3.11 run_tests.py
      hydro
      gold/triple
      gold/triple_amr
      gold/triple_amr_sparse
      gold/shafranov
      gold/rt_plasma_viscosity
      radiation_diffusion/marshak
      gold/steady_radiation_shock
      radiation_transport
      strength
      mix
      --log_file=log_file_gpu.txt
      --cmake=-DRIOT_ENABLE_CUDA=On
      --cmake=-DKokkos_ARCH_VOLTA70=On
      --cmake=-DCMAKE_CXX_COMPILER=$CI_PROJECT_DIR/external/parthenon/external/Kokkos/bin/nvcc_wrapper
      --cmake=-DCMAKE_C_COMPILER=$CC
      --cmake=-DPLUGINS_DIR=${PLUGINS_REPO_DIR}
      --cmake=-DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_BIN
      --cmake=-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE_BIN
      --cmake=-DRIOT_REGRESSION_GOLD_VER=$GOLD_VER
      --cmake=-DRIOT_REGRESSION_GOLD_HASH=$GOLD_HASH
      --cmake=-DRIOT_REGRESSION_GOLD_LOCAL=$GOLD_LOCAL
      --cmake=-DRIOT_ENABLE_REGRESSION_TESTS=ON
      --cmake=-DCMAKE_INSTALL_PREFIX=${INSTALL_PREFIX}
      --save_build
      --make_nproc=32
      --gpu
    - $CCACHE_BIN -s
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - tst/log_file_gpu.txt

unit_darwin-v100:
  stage: regression
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://asc-git.lanl.gov
  tags:
    - darwin-slurm-shared
  variables:
    SCHEDULER_PARAMETERS: "--nodes=1 --partition=volta-x86"
    CCACHE_TAG: darwin-v100
  only:
    - main
    - merge_requests
  script:
    - module load nvhpc/25.1 cuda/12.9.1 gcc/11.2.0 hdf5/1.12.2
    - cd ${CI_PROJECT_DIR}
    - python3 -m venv gpu_venv
    - source gpu_venv/bin/activate
    - pip install h5py numpy
    - mkdir -p build && cd build
    - cmake -DRIOT_ENABLE_UNIT_TESTS=ON -DPLUGINS_DIR=${PLUGINS_REPO_DIR} -DRIOT_ENABLE_CUDA=ON -DKokkos_ARCH_VOLTA70=ON -DCMAKE_CXX_COMPILER=$CI_PROJECT_DIR/external/parthenon/external/Kokkos/bin/nvcc_wrapper -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_BIN -DCMAKE_C_COMPILER_LAUNCHER=$CCACHE_BIN ..
    - make -j32
    - ctest
    - $CCACHE_BIN -s
