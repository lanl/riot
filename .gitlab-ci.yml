variables:
  GIT_SUBMODULE_STRATEGY: recursive
  PLUGINS_REPO: "rpm/riot_plugins.git"
  PLUGINS_REPO_DIR: "${CI_PROJECT_DIR}/../riot_plugins"
  PLUGINS_COMMIT: "8c76c857d408567a29b465236e2bd5349740dc5b"
  # Static ccache release fetched on the frontend (see pre_get_sources_script).
  CCACHE_VERSION: "4.10.2"
  # Regression gold standard, pre-fetched on the frontend. These MUST mirror
  # RIOT_REGRESSION_GOLD_VER / _HASH in CMakeLists.txt (a mismatch is caught by
  # the cmake hash check rather than silently using stale gold).
  GOLD_VER: "20260830"
  GOLD_HASH: "SHA512=f07281fae0845de80dd9d76e5f73e8da64b8f6e0bf282bbe003dcd20659eddc83c71be2d0802a2535c675c59e8e179facff68af6219c78db8b3fd8f63d21f67d"

default:
  hooks:
    pre_get_sources_script:
    - |
      rm -rf ${PLUGINS_REPO_DIR}
      # Force the job token into any absolute https://${CI_INTERNAL_HOST}/ URL so
      # that --recursive can also fetch riot_plugins' submodule(s). This is passed
      # via env (not `git config --global`) so it applies to the submodule child
      # processes without writing the token into ~/.gitconfig (concurrent jobs for
      # the same user would otherwise race on that file). Requires git >= 2.31.
      # NOTE: the submodule's own project must also allowlist *riot* (this
      # pipeline's project) in its CI/CD job-token settings -- the token is always
      # riot's, regardless of how deep the submodule nesting goes.
      # export GIT_CONFIG_COUNT=1
      # export GIT_CONFIG_KEY_0="url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_INTERNAL_HOST}/.insteadOf"
      # export GIT_CONFIG_VALUE_0="https://${CI_INTERNAL_HOST}/"
      git clone --recursive "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_INTERNAL_HOST}/${PLUGINS_REPO}" "${PLUGINS_REPO_DIR}"
      # unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
      # git clone --recursive "git@${CI_INTERNAL_HOST}:${PLUGINS_REPO}" "${PLUGINS_REPO_DIR}"
      realpath ${PLUGINS_REPO_DIR}
      git -C "${PLUGINS_REPO_DIR}" checkout "${PLUGINS_COMMIT}"
      # Install a static ccache into $HOME (arch-specific path) so compute nodes
      # can use it even without internet. Idempotent: only downloads if missing.
      ccache_arch=$(uname -m)
      ccache_bin_dir="$HOME/jacamar-ci/riot-ccache/${CCACHE_VERSION}-linux-${ccache_arch}"
      if [ ! -x "${ccache_bin_dir}/ccache" ]; then
        ccache_tarball="ccache-${CCACHE_VERSION}-linux-${ccache_arch}.tar.xz"
        ccache_url="https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${ccache_tarball}"
        ccache_tmp=$(mktemp -d)
        curl -fSL --retry 3 "${ccache_url}" -o "${ccache_tmp}/${ccache_tarball}"
        tar -xf "${ccache_tmp}/${ccache_tarball}" -C "${ccache_tmp}"
        mkdir -p "${ccache_bin_dir}"
        cp "${ccache_tmp}/ccache-${CCACHE_VERSION}-linux-${ccache_arch}/ccache" "${ccache_bin_dir}/ccache"
        chmod +x "${ccache_bin_dir}/ccache"
        rm -rf "${ccache_tmp}"
      fi
      # Pre-fetch the regression gold tarball on the frontend (has internet) so the
      # compute-node cmake can consume it via RIOT_REGRESSION_GOLD_LOCAL. Idempotent.
      gold_dir="$HOME/jacamar-ci/riot-gold"
      gold_tarball="${gold_dir}/riot_regression_gold_${GOLD_VER}.tgz"
      if [ ! -f "${gold_tarball}" ]; then
        mkdir -p "${gold_dir}"
        gold_tmp=$(mktemp -d)
        gold_url="https://github.com/lanl/riot/releases/download/regression-gold-${GOLD_VER}/riot_regression_gold_${GOLD_VER}.tgz"
        curl -fSL --retry 3 "${gold_url}" -o "${gold_tmp}/gold.tgz"
        if ! echo "${GOLD_HASH#SHA512=}  ${gold_tmp}/gold.tgz" | sha512sum -c -; then
          echo "ERROR: pre-fetched gold tarball hash mismatch" >&2
          rm -rf "${gold_tmp}"
          exit 1
        fi
        mv "${gold_tmp}/gold.tgz" "${gold_tarball}"
        rm -rf "${gold_tmp}"
      fi

before_script:
  - module load cmake/3.26.3
  # ccache setup. CCACHE_BIN and CCACHE_DIR are consumed by the build steps below.
  - export CCACHE_BIN="$HOME/jacamar-ci/riot-ccache/${CCACHE_VERSION}-linux-$(uname -m)/ccache"
  - export CCACHE_DIR="$HOME/jacamar-ci/riot-ccache/${CCACHE_TAG}"
  - export CCACHE_BASEDIR="$CI_PROJECT_DIR"
  - export CCACHE_MAXSIZE=5G
  - $CCACHE_BIN --version
  - $CCACHE_BIN -z
  # Path to the gold tarball pre-fetched by the hook; passed to cmake below.
  - export GOLD_LOCAL="$HOME/jacamar-ci/riot-gold/riot_regression_gold_${GOLD_VER}.tgz"

stages:
  - setup
  - regression

# Runs first, alone. The pre_get_sources_script hook downloads the shared ccache
# binary into $HOME here, so the parallel regression jobs below find it already
# present (their hooks skip the download) and never race to install it.
setup_ccache_darwin:
  stage: setup
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://asc-git.lanl.gov
  tags:
    - darwin-slurm-shared
  variables:
    SCHEDULER_PARAMETERS: "--nodes=1 --partition=skylake-gold"
    CCACHE_TAG: setup
  only:
    - main
    - merge_requests
  script:
    - echo "ccache provisioned at $CCACHE_BIN"
